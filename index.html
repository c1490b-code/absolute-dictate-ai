<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Absolute Dictate AI</title><style>body{margin:0;background:#10131a;color:#eef2f8;font:16px system-ui}main{max-width:900px;margin:auto;padding:18px}section{background:#1a202b;border:1px solid #313b4d;border-radius:14px;padding:16px;margin:12px 0}textarea,input{box-sizing:border-box;width:100%;background:#0c1118;color:inherit;border:1px solid #46536a;border-radius:9px;padding:12px;margin:8px 0;font:inherit}textarea{min-height:120px}button{background:#385a95;color:white;border:0;border-radius:10px;padding:12px;margin:4px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><h1>🎙️ Absolute Dictate AI</h1><p id="status">Loading</p><section><h2>Voice / Ask</h2><textarea id="txt" placeholder="Speak or type"></textarea><button onclick="voice()">Termux voice</button><button onclick="browserVoice()">Browser voice</button><button onclick="ask()">Ask model</button><button onclick="note()">Save note</button><pre id="ans"></pre></section><section><h2>File workspace (review before save)</h2><input id="name" placeholder="filename"><textarea id="content" placeholder="File contents"></textarea><button onclick="preview()">Preview</button><button onclick="save()">Approve and save</button><pre id="prev"></pre></section><section><h2>Workspace files</h2><button onclick="files()">Refresh</button><pre id="fl"></pre></section><section><h2>Notes</h2><button onclick="notes()">Refresh</button><pre id="nt"></pre></section></main><script>const $=id=>document.getElementById(id);async function post(p,d){let r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)throw Error(j.error);return j}async function voice(){try{$('txt').value=(await post('/api/voice',{})).text}catch(e){$('ans').textContent=e}}function browserVoice(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('ans').textContent='Browser voice not available on this browser';return}let r=new R();r.lang='en-US';r.onresult=e=>$('txt').value+=e.results[0][0].transcript;r.onerror=e=>$('ans').textContent=e.error;r.start()}async function ask(){try{$('ans').textContent=(await post('/api/ask',{text:$('txt').value})).answer}catch(e){$('ans').textContent=e}}async function note(){try{$('ans').textContent=JSON.stringify(await post('/api/note',{text:$('txt').value}))}catch(e){$('ans').textContent=e}}async function preview(){try{$('prev').textContent=JSON.stringify(await post('/api/preview',{name:$('name').value,content:$('content').value}),null,2)}catch(e){$('prev').textContent=e}}async function save(){if(!confirm('Save reviewed file in workspace?'))return;try{$('prev').textContent=JSON.stringify(await post('/api/save',{name:$('name').value,content:$('content').value}),null,2);files()}catch(e){$('prev').textContent=e}}async function files(){$('fl').textContent=JSON.stringify(await fetch('/api/files').then(r=>r.json()),null,2)}async function notes(){$('nt').textContent=JSON.stringify(await fetch('/api/notes').then(r=>r.json()),null,2)}fetch('/api/status').then(r=>r.json()).then(s=>$('status').textContent=s.name+' '+s.version+' | '+s.workspace+' | '+s.endpoint);files();notes();</script></html>
